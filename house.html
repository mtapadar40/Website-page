<!DOCTYPE HTML>
<html>
<head>
    <title>House</title>

    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <link rel="stylesheet" href="assets/css/bootstrap.min.css">
    <link rel="stylesheet" href="assets/css/main.css">
    <style>
    .house-gallery {
        padding-top: 30px;
        padding-bottom: 40px;
    }

    .gallery-row {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 20px;
        margin-bottom: 25px;
    }

    .gallery-row img {
        width: 100%;
        height: 280px;
        object-fit: contain;
        background-color: white;
        border: 1px solid #dddddd;
        cursor: zoom-in;
    }

    .image-modal {
        display: none;
        position: fixed;
        z-index: 9999;
        left: 0;
        top: 0;
        width: 100%;
        height: 100%;
        padding: 40px;
        background-color: rgba(0, 0, 0, 0.9);
        align-items: center;
        justify-content: center;
    }

    .large-image {
        max-width: 95%;
        max-height: 90%;
        object-fit: contain;
    }

    .close-image {
        position: absolute;
        top: 15px;
        right: 30px;
        color: white;
        font-size: 45px;
        cursor: pointer;
    }

    @media (max-width: 768px) {
        .gallery-row {
            grid-template-columns: 1fr;
        }
    }
</style>
</head>

<body>

    <section class="head" id="header">
        <div class="wrapper">
            <div class="container">
                <div class="row">
                    <div class="col-md-12">
                        <header class="header">
                            <div class="inner">

                                <a href="index.html" class="logo">
                                    <span class="symbol">
                                        <img src="images/logo.png" alt="Logo">
                                    </span>

                                    <span class="title">
                                        Mohammed Tapadar
                                    </span>
                                </a>

                            </div>
                        </header>
                    </div>
                </div>
            </div>
        </div>
    </section>

    <div class="container house-gallery">

    <div class="gallery-row">
        <img src="images/House/First floor.jpg"
             alt="First floor"
             onclick="openImage(this)">

        <img src="images/House/Second floor.jpg"
             alt="Second floor"
             onclick="openImage(this)">

        <img src="images/House/Third floor.jpg"
             alt="Third floor"
             onclick="openImage(this)">
    </div>

    <div class="gallery-row">
        <img src="images/House/Ortho first.jpg"
             alt="First orthographic view"
             onclick="openImage(this)">

        <img src="images/House/Ortho second.jpg"
             alt="Second orthographic view"
             onclick="openImage(this)">

        <img src="images/House/Ortho third.jpg"
             alt="Third orthographic view"
             onclick="openImage(this)">
    </div>

    <div class="gallery-row">
        <img src="images/House/Section 1.jpg"
             alt="Section 1"
             onclick="openImage(this)">

        <img src="images/House/Section 2.jpg"
             alt="Section 2"
             onclick="openImage(this)">

        <img src="images/House/Section 3.jpg"
             alt="Section 3"
             onclick="openImage(this)">
    </div>

</div>

<div id="imageModal" class="image-modal" onclick="closeImage(event)">
    <span class="close-image" onclick="closeImage()">&times;</span>
    <img id="largeImage" class="large-image" alt="">
</div>
    
<script>
    function openImage(image) {
        document.getElementById("imageModal").style.display = "flex";
        document.getElementById("largeImage").src = image.src;
        document.getElementById("largeImage").alt = image.alt;
    }

    function closeImage(event) {
        if (!event || event.target.id === "imageModal") {
            document.getElementById("imageModal").style.display = "none";
        }
    }

    document.addEventListener("keydown", function(event) {
        if (event.key === "Escape") {
            document.getElementById("imageModal").style.display = "none";
        }
    });
</script>

</body>
</html>
